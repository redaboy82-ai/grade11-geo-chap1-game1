<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رحلة التميز في الجيولوجيا - مستر رضا عوض</title>
  <style>
    /* CSS & Themes */
    :root {
      --bg-color: #0a192f;
      --card-bg: #172a45;
      --accent-color: #d4af37;
      --text-color: #e6f1ff;
      --text-secondary: #8892b0;
      --correct-color: #2ea44f;
      --wrong-color: #d9381e;
      --hover-glow: rgba(212, 175, 55, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background-color: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--hover-glow);
      position: relative;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.4s ease-in-out;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header & Info */
    .header-info {
      text-align: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 15px;
      margin-bottom: 10px;
    }

    .teacher-name {
      font-size: 1.6rem;
      color: var(--accent-color);
      font-weight: bold;
    }

    .teacher-phone {
      font-size: 1.1rem;
      color: var(--text-secondary);
      direction: ltr;
      display: inline-block;
      margin-top: 5px;
    }

    .meta-data {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--accent-color);
    }

    .meta-badge {
      background: rgba(212, 175, 55, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--accent-color);
    }

    /* Titles & Typography */
    h1 {
      color: var(--accent-color);
      text-align: center;
      font-size: 1.8rem;
    }

    .dhikr {
      text-align: center;
      font-size: 1.2rem;
      color: #64ffda;
      background: rgba(100, 255, 218, 0.05);
      padding: 12px;
      border-radius: 8px;
      border-right: 4px solid #64ffda;
      margin: 10px 0;
    }

    /* Buttons */
    .btn {
      background-color: transparent;
      color: var(--accent-color);
      border: 2px solid var(--accent-color);
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .btn:hover {
      background-color: var(--accent-color);
      color: var(--bg-color);
      box-shadow: 0 0 15px var(--accent-color);
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      height: 12px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-color), #f39c12);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-align: left;
    }

    /* Quiz Box */
    .question-title {
      font-size: 1.25rem;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: rgba(255, 255, 255, 0.03);
      color: var(--text-color);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 14px 18px;
      border-radius: 8px;
      text-align: right;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      border-color: var(--accent-color);
      background-color: rgba(212, 175, 55, 0.08);
    }

    .option-btn.correct {
      background-color: rgba(46, 164, 79, 0.2) !important;
      border-color: var(--correct-color) !important;
      color: #2ea44f !important;
      box-shadow: 0 0 15px rgba(46, 164, 79, 0.5);
    }

    .option-btn.wrong {
      background-color: rgba(217, 56, 30, 0.2) !important;
      border-color: var(--wrong-color) !important;
      color: #ff6b6b !important;
      box-shadow: 0 0 15px rgba(217, 56, 30, 0.5);
    }

    /* Table & Results */
    .table-container {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    th {
      background-color: rgba(212, 175, 55, 0.15);
      color: var(--accent-color);
      position: sticky;
      top: 0;
    }

    .summary-card {
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .summary-card p {
      margin: 5px 0;
      font-size: 1.1rem;
    }

    @media (max-width: 600px) {
      .container { padding: 20px 15px; }
      h1 { font-size: 1.4rem; }
      .btn { width: 100%; }
      th, td { padding: 8px 10px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- شاشة البداية -->
  <div id="start-screen" class="screen active">
    <div class="header-info">
      <div class="teacher-name">مستر رضا عوض</div>
      <div class="teacher-phone">00201093559477</div>
      <div class="meta-data" id="start-meta"></div>
    </div>
    
    <h1>مرحباً بكم في رحلة التميز</h1>
    
    <div class="dhikr">"لا إله إلا أنت سبحانك إني كنت من الظالمين"</div>
    
    <button class="btn" onclick="startQuiz()">ابدأ الاختبار</button>
  </div>

  <!-- شاشة الأسئلة -->
  <div id="quiz-screen" class="screen">
    <div class="header-info">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="teacher-name" style="font-size: 1.2rem;">مستر رضا عوض</span>
        <span class="teacher-phone" style="font-size: 0.9rem;">00201093559477</span>
      </div>
      <div class="meta-data" id="quiz-meta"></div>
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
        <span id="question-count" style="font-size: 0.9rem; color: var(--text-secondary);">السؤال 1</span>
        <span id="progress-percent" class="progress-text">0%</span>
      </div>
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </div>

    <div id="question-box">
      <h2 id="question-text" class="question-title">نص السؤال هنا...</h2>
      <div id="options-container" class="options-grid"></div>
    </div>
  </div>

  <!-- شاشة النتائج -->
  <div id="result-screen" class="screen">
    <h1>نتيجة الاختبار الإحصائية</h1>
    
    <div class="summary-card">
      <p id="total-attempts-text">إجمالي المحاولات: 0</p>
      <p id="rating-text" style="color: var(--accent-color); font-weight: bold;">التقييم: ممتاز</p>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>نص السؤال</th>
            <th>عدد المحاولات</th>
          </tr>
        </thead>
        <tbody id="results-table-body"></tbody>
      </table>
    </div>

    <div class="header-info" style="border: none; margin-top: 10px;">
      <p>مع خالص تحيات: <span class="teacher-name" style="font-size: 1rem;">مستر رضا عوض</span> (00201093559477)</p>
    </div>

    <button class="btn" onclick="restartQuiz()">إعادة المحاولة</button>
  </div>

</div>

<script>
  // البيانات التعريفية
  const metaConfig = {
    grade: "الصف الحادي عشر علمي",
    term: "الفترة الدراسية الأولى"
  };

  // مصفوفة الأسئلة بعد حذف السؤال المطلوب
  const quizData = [
    {
      q: "أحد مجالات علم الجيولوجيا يتناول دراسة المواد المكونة للأرض والعمليات التي تتم تحت سطح الأرض أو على سطحها:",
      options: ["الجيولوجيا التركيبية", "جيولوجيا التعدين", "الجيولوجيا الفيزيائية", "الجيولوجيا التاريخية"],

    {
      q: "المجال الذي يسعى إلى وضع ترتيب زمني للتغييرات الفيزيائية والبيولوجية التي حدثت في الماضي:",
      options: ["الجيولوجيا التركيبية", "الجيولوجيا الفيزيائية", "جيولوجيا التعدين", "الجيولوجيا التاريخية"],
      answer: "الجيولوجيا التاريخية"
    },
    {
      q: "لفهم كيفية نشأة الصخور قديماً علينا أن نتعرف على العمليات الحالية التي تؤثر في الصخور ونتائجها، وهذا ما ينص عليه مفهوم:",
      options: ["الماضي مفتاح الحاضر", "الحاضر مفتاح الماضي", "شكل الأرض لم يتغير منذ زمن طويل", "الزمن الجيولوجي القديم له قوانينه الخاصة"],
      answer: "الحاضر مفتاح الماضي"
    },
    {
      q: "عبارة: 'لا يرتبط علم الأرض بعلم الفلك' تعتبر عبارة:",
      options: ["صحيحة", "غير صحيحة (خطأ)"],
      answer: "غير صحيحة (خطأ)"
    },
    {
      q: "عبارة: 'يجب دراسة تاريخ الأرض قبل دراسة الجيولوجيا الفيزيائية' تعتبر عبارة:",
      options: ["صحيحة", "غير صحيحة (خطأ)"],
      answer: "غير صحيحة (خطأ)"
    },
    {
      q: "عبارة: 'بعض التغيرات التي تؤثر على سطح الأرض تكون أحياناً سريعة كالانزلاقات الأرضية وثورات البراكين' تعتبر عبارة:",
      options: ["صحيحة", "غير صحيحة (خطأ)"],
      answer: "صحيحة"
    },
    {
      q: "تقسم الجيولوجيا بشكل رئيسي إلى مجالين أساسيين هما:",
      options: ["الجيولوجيا الفيزيائية والجيولوجيا التاريخية", "الجيولوجيا التركيبية وجيولوجيا التعدين", "علم المعادن وعلم الأحافير", "جيولوجيا الكواكب وجيولوجيا المياه"],
      answer: "الجيولوجيا الفيزيائية والجيولوجيا التاريخية"
    },
    {
      q: "أول محاولة تمت لتحديد عمر الأرض تم فيها استخدام:",
      options: ["الطاقة الإشعاعية", "دراسة طبقات الرسوبيات", "قياس ملوحة المحيطات", "سرعة التجوية والتعرية"],
      answer: "الطاقة الإشعاعية"
    },
    {
      q: "وضع العالم جيمس هاتون مبدأ يعد ركيزة الجيولوجيا الحديثة يسمى مبدأ:",
      options: ["الوتيرة الواحدة أو الانتظام المستديم", "نظرية الكوارث", "التمايز الكوني", "سحابة الغبار"],
      answer: "الوتيرة الواحدة أو الانتظام المستديم"
    },
    {
      q: "علم يختص بدراسة كل ما يتعلق بالأرض من حيث نشأتها وعلاقتها بالأجرام السماوية وتركيبها والأحداث التي شهدتها والعوامل التي تؤثر فيها:",
      options: ["علم الأرض (الجيولوجيا)", "علم الفلك", "علم المحيطات", "علم الطبقات"],
      answer: "علم الأرض (الجيولوجيا)"
    },
    {
      q: "النظرية التي تنص على أن المواقع الطبيعية للأرض تشكلت بعد وقوع كوارث هائلة هي:",
      options: ["نظرية الكوارث", "مبدأ الوتيرة الواحدة", "نظرية التمايز", "نظرية الانحسار"],
      answer: "نظرية الكوارث"
    },
    {
      q: "تتطلب الجيولوجيا فهماً وتطبيقاً لمبادئ علوم أساسية هي:",
      options: ["الفيزياء والكيمياء والأحياء", "الرياضيات والهندسة والفلك", "الجغرافيا والاقتصاد والاجتماع", "التاريخ والفلسفة والفيزياء"],
      answer: "الفيزياء والكيمياء والأحياء"
    },
    {
      q: "كوكب الأرض في تغير دائم بسب كونه يتأثر بـ:",
      options: [
        "حدوث تغيرات سريعة مثل الزلازل والبراكين والانزلاقات الأرضية، بالإضافة لتغيرات بطيئة جداً غير ملحوظة",
        "تغيرات سريعة فقط دون وجود أي تغيرات بطيئة",
        "عوامل خارجية فضائية فقط دون تأثر بالداخل",
        "ثبات الملامح الجيولوجية مع الزمن"
      ],
      answer: "حدوث تغيرات سريعة مثل الزلازل والبراكين والانزلاقات الأرضية، بالإضافة لتغيرات بطيئة جداً غير ملحوظة"
    },
    {
      q: "يعتقد الكثيرون أن كوكب الأرض ثابت الملامح وغير متغير بسبب:",
      options: [
        "أن التغيرات التي تطرأ عليه تكون بطيئة جداً ويصعب ملاحظتها",
        "عدم وجود زلازل أو براكين إطلاقاً",
        "ثبات الصخور وعدم تعرضها للتجوية",
        "أن الأرض جسم غير ديناميكي"
      ],
      answer: "أن التغيرات التي تطرأ عليه تكون بطيئة جداً ويصعب ملاحظتها"
    },
    {
      q: "يمثل فهم كوكب الأرض تحدياً كبيراً للعلماء لأن:",
      options: [
        "كوكبنا جسم ديناميكي ذو أجزاء متفاعلة عديدة وتاريخ معقد",
        "عمر الأرض قصير جداً ولا يتعدى ألف سنة",
        "الصخور القديمة لا تتبع أية قوانين طبيعية",
        "لا توجد وسائل تكنولوجية لدراسته"
      ],
      answer: "كوكبنا جسم ديناميكي ذو أجزاء متفاعلة عديدة وتاريخ معقد"
    },
    {
      q: "يجب دراسة الجيولوجيا الفيزيائية قبل دراسة تاريخ الأرض منطقياً لأن:",
      options: [
        "علينا إدراك كيف يعمل كوكب الأرض أولاً قبل أن نحاول التعرف على أحداث الماضي",
        "الجيولوجيا الفيزيائية أسهل في الحفظ",
        "تاريخ الأرض غير مهم في الدراسة الجيولوجية",
        "الجيولوجيا التاريخية لا تعتمد على الصخور"
      ],
      answer: "علينا إدراك كيف يعمل كوكب الأرض أولاً قبل أن نحاول التعرف على أحداث الماضي"
    },
    {
      q: "معنى كلمة 'جيولوجيا' المأخوذة من المقطعين Geo و logy هو:",
      options: [
        "Geo تعني الأرض، وlogy تعني علم (علم الأرض)",
        "Geo تعني الصخر، وlogy تعني حساب",
        "Geo تعني الطبقات، وlogy تعني رسم",
        "Geo تعني الفضاء، وlogy تعني دراسة"
      ],
      answer: "Geo تعني الأرض، وlogy تعني علم (علم الأرض)"
    }
  ];

  // متغيرات حالة اللعبة
  let currentQuestions = [];
  let currentQuestionIndex = 0;
  let attempts = [];
  let audioCtx = null;

  // تهيئة الأصوات بواسطة Web Audio API
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(isCorrect) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (isCorrect) {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }
  }

  // خلط العناصر عشوائياً (Fisher-Yates Shuffle)
  function shuffleArray(arr) {
    const array = [...arr];
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  // إعداد البيانات التعريفية في الهيدر
  function renderMeta() {
    const metas = [];
    if (metaConfig.grade && metaConfig.grade.trim() !== "") metas.push(metaConfig.grade);
    if (metaConfig.term && metaConfig.term.trim() !== "") metas.push(metaConfig.term);
    
    const html = metas.map(m => `<span class="meta-badge">${m}</span>`).join('');
    document.getElementById('start-meta').innerHTML = html;
    document.getElementById('quiz-meta').innerHTML = html;
  }

  // إشعار وتبديل الشاشات
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // بدء الاختبار
  function startQuiz() {
    initAudio();
    currentQuestions = shuffleArray(quizData);
    currentQuestionIndex = 0;
    attempts = new Array(currentQuestions.length).fill(0);
    showScreen('quiz-screen');
    loadQuestion();
  }

  // تحميل السؤال الحاضر
  function loadQuestion() {
    const qData = currentQuestions[currentQuestionIndex];
    document.getElementById('question-count').innerText = `السؤال ${currentQuestionIndex + 1} من ${currentQuestions.length}`;
    
    const percent = Math.round((currentQuestionIndex / currentQuestions.length) * 100);
    document.getElementById('progress-bar').style.width = `${percent}%`;
    document.getElementById('progress-percent').innerText = `${percent}%`;

    document.getElementById('question-text').innerText = qData.q;

    const shuffledOptions = shuffleArray(qData.options);
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    shuffledOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => handleAnswer(opt, btn);
      container.appendChild(btn);
    });
  }

  // معالجة اختيار الإجابة
  function handleAnswer(selectedOption, btn) {
    attempts[currentQuestionIndex]++;
    const qData = currentQuestions[currentQuestionIndex];

    if (selectedOption === qData.answer) {
      playSound(true);
      btn.classList.add('correct');
      document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');

      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
          loadQuestion();
        } else {
          showResults();
        }
      }, 700);

    } else {
      playSound(false);
      btn.classList.add('wrong');
      btn.style.pointerEvents = 'none';
    }
  }

  // عرض النتائج النهائية
  function showResults() {
    showScreen('result-screen');
    
    const tbody = document.getElementById('results-table-body');
    tbody.innerHTML = '';
    
    let totalAttempts = 0;
    
    currentQuestions.forEach((q, idx) => {
      const count = attempts[idx];
      totalAttempts += count;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td>${q.q}</td>
        <td style="text-align: center; font-weight: bold; color: var(--accent-color);">${count}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('total-attempts-text').innerText = `إجمالي المحاولات لجميع الأسئلة: ${totalAttempts} من أصل ${currentQuestions.length} سؤالاً`;
    
    const diff = totalAttempts - currentQuestions.length;
    let rating = "ممتاز جداً 🌟🌟🌟";
    if (diff > 10) rating = "مقبول - يحتاج إلى مراجعة إضافية 📚";
    else if (diff > 4) rating = "جيد جداً 👍";
    
    document.getElementById('rating-text').innerText = `التقييم النهائي: ${rating}`;
  }

  // إعادة المحاولة
  function restartQuiz() {
    startQuiz();
  }

  // عند تحميل الصفحة
  window.onload = () => {
    renderMeta();
  };
</script>

</body>
</html>
